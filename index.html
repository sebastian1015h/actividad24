<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Mapa interactivo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; }
        #header {
            background: #e53935;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
        }
        #instrucciones {
            background: #fff8e1;
            border-bottom: 1px solid #ffe082;
            padding: 7px 20px;
            font-size: 13px;
            color: #555;
        }
        #map {
            width: 100%;
            height: calc(100vh - 74px);
        }
    </style>
</head>
<body>
    <div id="header">🗺️ Mapa interactivo</div>
    <div id="instrucciones">
        🖱️ <strong>Clic izquierdo</strong> en el mapa para agregar un marcador &nbsp;|&nbsp;
        🖱️ <strong>Clic derecho</strong> sobre un marcador para editar su nombre
    </div>
    <div id="map"></div>
    <script src="script.js"></script>
</body>
</html>
